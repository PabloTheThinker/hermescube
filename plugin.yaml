name: hermescube
manifest_version: 1
version: "0.38.1"
description: >-
  Living Cube memory for Hermes Agent — provenance-preserving events and
  temporal claims, HAR retrieval, subagent branches, evidence-packet prefetch,
  branched consolidation, consent-gated procedure→skill bridge, the Hive
  nexus for multi-agent collective memory (nightly pilgrimage: offer,
  assimilate, draw), peer interviews (interview-me protocol) that mint
  consent-gated skill drafts, a grounded self-evolution harness, and Fleet HQ
  (charters, routing, handoffs, claims, verification, baselines).
  Zero network dependencies, pure Python with optional numpy acceleration.
author: PabloTheThinker
license: MIT
homepage: https://github.com/PabloTheThinker/hermescube
platforms: [linux, macos]

requires:
  python: ">=3.11"

config:
  auto_extract:
    description: Auto-extract facts from conversations at session end using regex patterns
    type: bool
    default: false
  query_rewrite:
    description: LLM query rewrite before HAR retrieval (uses auxiliary client; slow)
    type: bool
    default: false
  dim:
    description: HRR vector dimension (256 recommended)
    type: int
    default: 256
  l2_buckets:
    description: Number of L2 topic buckets for HAR clustering
    type: int
    default: 64
  char_limit:
    description: Maximum characters per memory entry
    type: int
    default: 2200
  evolve_interval:
    description: Auto-evolve after N entries (0 to disable)
    type: int
    default: 50
  memory_nudge_interval:
    description: Remind agent to review memory every N turns (0 to disable)
    type: int
    default: 10
  peer_card_cadence_s:
    description: Minimum seconds between peer card rebuilds (default 3600 = hourly)
    type: int
    default: 3600
  session_digest:
    description: Write session digest landmarks on session end
    type: bool
    default: true
  observe_on_session_end:
    description: Run trajectory observation on session end (tool chains → procedures)
    type: bool
    default: true
  replay_on_session_end:
    description: Run sleep replay consolidation on session end
    type: bool
    default: true
  conflict_detect:
    description: Detect conflicting beliefs/resolves on manage add
    type: bool
    default: true
  living_pulse_on_session_end:
    description: Run living archive multi-chamber pulse on session end
    type: bool
    default: true
  hive_path:
    description: Shared hive directory for multi-agent collective memory (empty = disabled)
    type: str
    default: ""
  hive_on_session_end:
    description: Run hive pilgrimage (offer/assimilate/draw) on session end
    type: bool
    default: false
  witness_detect:
    description: Auto-detect real friction (user corrections, hard errors) into the witness ledger
    type: bool
    default: true
  interview_on_pilgrimage:
    description: During hive pilgrimage, interview peer souls (interview-me) and mint skill drafts
    type: bool
    default: false

tools:
  - hermescube_search
  - hermescube_manage
  - hermescube_feedback
  - hermescube_probe

setup:
  type: pip
  package: hermescube
  pip_dependencies:
    - numpy
